<!-- name=templates/profile.html -->
{% extends "layout.html" %}
{% block body %}
  <h3>{{ target.name }} ({{target.age}})</h3>
  <p>{{ target.city }}</p>
  <p>{{ target.bio }}</p>

  <form method="post" action="{{ url_for('like', uid=target.id) }}" style="display:inline">
    <button class="btn btn-primary">❤ 喜欢 / 取消喜欢</button>
  </form>

  {% if matched %}
    <form method="post" action="{{ url_for('request_contact', uid=target.id) }}" style="display:inline">
      <button class="btn btn-success">联系客服索要联系方式</button>
    </form>
  {% endif %}

  {% if ticket %}
    <div class="mt-3">
      <strong>已提交工单：</strong> 状态：{{ ticket.status }}
      <a href="{{ url_for('view_ticket', ticket_id=ticket.id) }}">查看</a>
    </div>
  {% endif %}
{% endblock %}
