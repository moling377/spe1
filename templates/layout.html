<!-- name=templates/layout.html -->
<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8">
    <title>Dating MVP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand navbar-dark bg-primary mb-4">
      <div class="container">
        <a class="navbar-brand" href="{{ url_for('profiles') }}">DatingMVP</a>
        <div class="collapse navbar-collapse">
          <ul class="navbar-nav ms-auto">
            {% if session.user_id %}
              <li class="nav-item"><a class="nav-link" href="{{ url_for('profiles') }}">浏览</a></li>
              <li class="nav-item"><a class="nav-link" href="{{ url_for('my_tickets') }}">我的工单</a></li>
              <li class="nav-item"><a class="nav-link" href="{{ url_for('logout') }}">退出</a></li>
            {% else %}
              <li class="nav-item"><a class="nav-link" href="{{ url_for('login') }}">登录</a></li>
            {% endif %}
          </ul>
        </div>
      </div>
    </nav>
    <div class="container">
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="mb-3">
            {% for m in messages %}
              <div class="alert alert-info">{{ m }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}
      {% block body %}{% endblock %}
    </div>
  </body>
</html>
