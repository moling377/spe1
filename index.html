<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <title>静态约会演示</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand navbar-dark bg-primary mb-4">
    <div class="container">
      <a class="navbar-brand" href="#">Dating (静态版)</a>
      <div class="d-flex">
        <button id="btn-show-login" class="btn btn-sm btn-light me-2">选择用户登录</button>
        <button id="btn-admin" class="btn btn-sm btn-outline-light">联系客服</button>
      </div>
    </div>
  </nav>

  <main class="container">
    <div id="login-area" class="mb-3 card p-3">
      <h5>登录 / 切换用户（演示）</h5>
      <div class="row g-2">
        <div class="col-auto">
          <input id="input-user-id" class="form-control" placeholder="输入用户 ID (1 ~ 1000)">
        </div>
        <div class="col-auto">
          <button id="btn-login" class="btn btn-primary">登录</button>
        </div>
        <div class="col-12 mt-2">
          <small>或从下面快速选择（前 50）</small>
          <div id="sample-users" class="list-group mt-1" style="max-height:180px; overflow:auto;"></div>
        </div>
      </div>
    </div>

    <div id="profile-list" class="row"></div>

    <nav>
      <ul id="pager" class="pagination mt-3"></ul>
    </nav>
  </main>

  <!-- 模态: 查看单个档案 -->
  <div class="modal" tabindex="-1" id="profileModal">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 id="modal-name" class="modal-title"></h5>
          <button type="button" class="btn-close" id="close-modal"></button>
        </div>
        <div class="modal-body">
          <p id="modal-city"></p>
          <p id="modal-bio"></p>
          <div id="modal-actions"></div>
          <div id="modal-ticket" class="mt-3"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
