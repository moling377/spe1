<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Dating Demo — Browse</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="#">Dating Demo</a>
      <div class="d-flex align-items-center gap-3">
        <div class="text-white small" id="online-area">Online now: <span id="online-count">0</span></div>
        <input id="search-q" class="form-control form-control-sm" style="width:260px" placeholder="Search name or job">
        <button id="btn-search" class="btn btn-sm btn-light">Search</button>
        <div class="btn-group" role="group">
          <button id="btn-gender-male" class="btn btn-sm btn-outline-light">I'm Male</button>
          <button id="btn-gender-female" class="btn btn-sm btn-outline-light">I'm Female</button>
        </div>
        <button id="btn-contact-support" class="btn btn-sm btn-light">Contact Support</button>
      </div>
    </div>
  </nav>

  <main class="container my-4">
    <div id="info-row" class="mb-3 text-muted">You can browse as a guest. Choose your gender to get tailored recommendations (we'll show profiles of the opposite gender).</div>

    <div id="profile-grid" class="row g-3"></div>

    <nav aria-label="Page navigation">
      <ul id="pager" class="pagination justify-content-center mt-4"></ul>
    </nav>

    <div id="visitor-area" class="card p-3 mt-4">
      <div class="d-flex gap-2 align-items-center mb-2">
        <div class="me-2 small-muted">Visitor type:</div>
        <div id="visitor-type" class="fw-semibold">Guest</div>
        <div class="ms-auto small-muted">Favorites: <span id="fav-count">0</span></div>
      </div>
      <div>
        <small>Tip: click any profile card to contact support via WhatsApp about that profile.</small>
      </div>
    </div>

  </main>

  <!-- Profile Modal -->
  <div class="modal" id="profileModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-body p-3">
          <div class="d-flex gap-3">
            <img id="modal-photo" src="" class="rounded" style="width:180px; height:180px; object-fit:cover">
            <div class="flex-grow-1">
              <h4 id="modal-name"></h4>
              <div class="text-muted mb-2" id="modal-location"></div>
              <p id="modal-bio"></p>
              <div id="modal-actions" class="mt-3"></div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button id="close-modal" class="btn btn-sm btn-secondary">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
